<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopKeeper Admin - Loading</title>
    <!-- Google Font (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #030712);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Background Effect */
        .ambient-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.35;
            z-index: 1;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9); opacity: 0.25; }
            100% { transform: scale(1.15); opacity: 0.45; }
        }

        /* Premium Glass Card */
        .loading-card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #ffffff;
        }

        /* Animated Shopkeeper Icon Container */
        .icon-wrapper {
            position: relative;
            width: 85px;
            height: 85px;
            margin: 0 auto 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .icon-wrapper svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: #a5b4fc;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Brand & Titles */
        .brand-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .brand-title span {
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 30px;
        }

        /* Premium Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #d946ef);
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(217, 70, 239, 0.7);
            transition: width 0.05s ease;
        }

        /* Bottom Status Area */
        .status-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .counter {
            font-weight: 600;
            color: #a5b4fc;
            letter-spacing: 0.5px;
        }

        /* Blinking Green Dot for Active System */
        .dot {
            height: 6px;
            width: 6px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 8px #10b981;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <!-- Background Glow Effect -->
    <div class="ambient-glow"></div>

    <!-- Main Loading Card -->
    <div class="loading-card">
        
        <!-- Shopkeeper Storefront SVG Icon -->
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                <path d="M2 9h20"></path>
            </svg>
        </div>

        <h1 class="brand-title">SHOPKEEPER <span>PRO</span></h1>
        <p class="subtitle">স্মার্ট স্টোর ম্যানেজমেন্ট সিস্টেম</p>

        <!-- Dynamic Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Status & Counter -->
        <div class="status-info">
            <div><span class="dot"></span>প্যানেল প্রস্তুত হচ্ছে...</div>
            <div class="counter" id="progressPercent">0%</div>
        </div>

    </div>

    <!-- Redirection & Animation Logic -->
    <script>
        const progressBar = document.getElementById("progressBar");
        const progressPercent = document.getElementById("progressPercent");

        let progress = 0;
        const totalDuration = 3200; // মোট ৩.২ সেকেন্ড সময় নিবে
        const intervalTime = 32;    // স্মুথ ট্রানজিশনের জন্য আপডেট রেট
        const increment = 100 / (totalDuration / intervalTime);

        const timer = setInterval(() => {
            progress += increment;

            if (progress >= 100) {
                progress = 100;
                clearInterval(timer);

                progressBar.style.width = "100%";
                progressPercent.innerText = "100%";

                // লোডিং শেষ হওয়ার সাথে সাথে admin-login.html পেজে নিয়ে যাবে
                setTimeout(() => {
                    window.location.href = "admin-login.html";
                }, 300);
            } else {
                progressBar.style.width = Math.floor(progress) + "%";
                progressPercent.innerText = Math.floor(progress) + "%";
            }
        }, intervalTime);
    </script>

</body>
</html>
