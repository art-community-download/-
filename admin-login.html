<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin & Shopkeeper Login | Poultry Shop Management</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #07080b;
      --card-bg: rgba(18, 20, 26, 0.75);
      --card-border: rgba(212, 175, 55, 0.28);
      --gold-primary: #d4af37;
      --gold-light: #f5d77f;
      --gold-dark: #997519;
      --gold-gradient: linear-gradient(135deg, #f7df87 0%, #d4af37 50%, #997519 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: rgba(10, 11, 15, 0.7);
      --input-border: rgba(212, 175, 55, 0.2);
      --gold-glow: 0 0 25px rgba(212, 175, 55, 0.35);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
      padding: 20px 15px;
    }

    .bg-animation {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #d4af37 0%, transparent 70%);
      top: -80px;
      left: -100px;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #997519 0%, transparent 70%);
      bottom: -120px;
      right: -100px;
      animation-duration: 22s;
    }

    .grid-pattern {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.1); }
      100% { transform: translate(-40px, 80px) scale(0.95); }
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 42px 34px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.75),
        0 0 35px rgba(212, 175, 55, 0.1),
        inset 0 1px 1px rgba(245, 215, 127, 0.2);
    }

    .header-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px auto;
      border-radius: 20px;
      background: radial-gradient(circle at 30% 30%, #2b271d 0%, #111216 100%);
      border: 1.5px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--gold-glow);
    }

    .logo-badge svg {
      width: 38px;
      height: 38px;
      stroke: var(--gold-primary);
      fill: none;
      stroke-width: 2;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 0.83rem;
      color: var(--text-muted);
    }

    .alert-box {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      line-height: 1.4;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-box.error {
      display: flex;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .alert-box.success {
      display: flex;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .alert-box svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: #e5e7eb;
      margin-bottom: 7px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--gold-primary);
      opacity: 0.75;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      height: 48px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 0 44px 0 42px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #ffffff;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
    }

    .toggle-password:hover {
      color: var(--gold-light);
    }

    .form-options {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.83rem;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .custom-checkbox {
      accent-color: var(--gold-primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-login {
      position: relative;
      width: 100%;
      height: 50px;
      background: var(--gold-gradient);
      border: none;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #0d0f14;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
      transition: all 0.3s ease;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.5);
    }

    .btn-login:disabled {
      opacity: 0.8;
      cursor: not-allowed;
    }

    .btn-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(13, 15, 20, 0.3);
      border-top-color: #0d0f14;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-note {
      text-align: center;
      margin-top: 26px;
      font-size: 0.74rem;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .footer-note svg {
      width: 14px;
      height: 14px;
      stroke: var(--gold-primary);
    }
  </style>
</head>
<body>

  <div class="bg-animation">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="grid-pattern"></div>

  <main class="login-container">
    <div class="glass-card">
      
      <header class="header-section">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="brand-title">SHOP MANAGEMENT PANEL</h1>
        <p class="brand-subtitle">অ্যাডমিন ও সেলস প্যানেলে প্রবেশের জন্য লগইন করুন</p>
      </header>

      <div id="alertBox" class="alert-box">
        <svg id="alertIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="alertMessage"></span>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="email" class="form-label">ইমেইল অ্যাড্রেস (Email Address)</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input type="email" id="email" value="badolboss@gmail.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">পাসওয়ার্ড (Password)</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" value="badol1234" required />
            <button type="button" id="togglePasswordBtn" class="toggle-password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" class="custom-checkbox" checked />
            <span>আমাকে মনে রাখুন (Remember Me)</span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="btn-login">
          <span id="btnText">লগইন করুন</span>
          <div id="btnSpinner" class="btn-spinner"></div>
        </button>
      </form>

      <footer class="footer-note">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>সুরক্ষিত এনক্রিপশন ও রোল-ভিত্তিক অনুমোদন সক্রিয়</span>
      </footer>

    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYPsjlOmRwH2F5P8fFoiirP1FLjgh3c8A",
      authDomain: "murgi-dfd67.firebaseapp.com",
      databaseURL: "https://murgi-dfd67-default-rtdb.firebaseio.com",
      projectId: "murgi-dfd67",
      storageBucket: "murgi-dfd67.firebasestorage.app",
      messagingSenderId: "209696889864",
      appId: "1:209696889864:web:3eaa16034f00cca45505bd"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const database = firebase.database();

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    const alertBox = document.getElementById('alertBox');
    const alertIcon = document.getElementById('alertIcon');
    const alertMessage = document.getElementById('alertMessage');

    function showAlert(type, message) {
      alertBox.className = `alert-box ${type}`;
      alertMessage.textContent = message;
      if (type === 'error') {
        alertIcon.innerHTML = `<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>`;
      } else {
        alertIcon.innerHTML = `<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>`;
      }
      alertBox.style.display = 'flex';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnText.textContent = isLoading ? "প্রসেস হচ্ছে..." : "লগইন করুন";
      btnSpinner.style.display = isLoading ? "block" : "none";
    }

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword 
        ? `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>`
        : `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      setLoading(true);

      try {
        let user;

        // চেষ্টা ১: সরাসরি লগইন করা
        try {
          const userCredential = await auth.signInWithEmailAndPassword(email, password);
          user = userCredential.user;
        } catch (authError) {
          // চেষ্টা ২: যদি পাসওয়ার্ড না মেলে বা অ্যাকাউন্ট না থাকে, অটো-ক্রিয়েট করবে!
          if (email.toLowerCase() === 'badolboss@gmail.com') {
            try {
              const newCred = await auth.createUserWithEmailAndPassword(email, password);
              user = newCred.user;
            } catch (createErr) {
              // যদি ইমেইল আগে থেকেই থাকে কিন্তু পাসওয়ার্ড একেবারেই অন্য কিছু দেওয়া থাকে
              throw new Error("আপনার ইমেইলটি তৈরি আছে, তবে Firebase Console-এ পাসওয়ার্ড badol1234 দেওয়া নেই। অনুগ্রহ করে Firebase Console থেকে পাসওয়ার্ডটি badol1234 করে দিন।");
            }
          } else {
            throw authError;
          }
        }

        // ডাটাবেজে admin রোল নিশ্চিত করা
        await database.ref(`users/${user.uid}`).update({
          email: user.email,
          role: 'admin',
          lastLogin: new Date().toISOString()
        });

        showAlert('success', 'অ্যাডমিন ভেরিফিকেশন সফল! ড্যাশবোর্ডে প্রবেশ করা হচ্ছে...');
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 800);

      } catch (error) {
        setLoading(false);
        console.error(error);
        showAlert('error', error.message || 'লগইন ব্যর্থ হয়েছে।');
      }
    });
  </script>
</body>
</html>
